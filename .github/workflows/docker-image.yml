name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps: #Pasos a seguir
    - name: Checkout code #Revisa el código que tenemos en nuesro repositorio
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Docker login
      env:
        DOCKER_USER: ${{secrets.DOCKER_ABDIEL_USER}}
        DOCKER_PASSWORD: ${{secrets.DOCKER_TOKEN}}
      run: | #Este caracter sierve para indicar que todas las siguientes lineas son comandos separados a ejecutar
        echo "Iniciando login"
        docker login -u $DOCKER_USER -p $DOCKER_PASSWORD
        echo "Fin del login"
    - name: Build Docker Image
      run: |
        docker build -t abdielperezb/docker-graphql:0.0.1 .
        docker build -t abdielperezb/docker-graphql:latest
    - name: Push Docker Image
      run: |
        docker push abdielperezb/docker-graphql:0.0.1
        docker push abdielperezb/docker-graphql:latest
        
    # - name: Build the Docker image
    #   run: docker build . --file Dockerfile --tag my-image-name:$(date +%s)
